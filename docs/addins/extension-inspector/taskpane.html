<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Extension Inspector</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <style>
    /* Solarized Light */
    :root {
      --base3:  #fdf6e3;
      --base2:  #eee8d5;
      --base1:  #93a1a1;
      --base0:  #657b83;
      --base00: #586e75;
      --blue:   #268bd2;
      --orange: #cb4b16;
      --green:  #859900;
      --red:    #dc322f;
      --yellow: #b58900;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      color: var(--base0);
      background: var(--base3);
      padding: 0 0 16px;
    }

    .brand-bar {
      background: var(--orange);
      color: #fff;
      text-align: right;
      padding: 3px 10px;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: .04em;
      margin-bottom: 10px;
    }

    .pane { padding: 0 12px; }

    /* Email info */
    .email-info { margin-bottom: 12px; }
    .email-info .field { margin-bottom: 4px; }
    .email-info label {
      display: inline-block;
      font-weight: 600;
      font-size: 11px;
      color: var(--base1);
      width: 52px;
    }
    .email-info span {
      font-size: 12px;
      color: var(--base00);
      word-break: break-all;
    }

    /* Status */
    #status {
      font-size: 12px;
      color: var(--base1);
      margin-bottom: 10px;
      min-height: 16px;
    }
    #status.error { color: var(--red); }

    /* Extension cards */
    .ext-card {
      background: var(--base3);
      border: 1px solid var(--base2);
      border-radius: 3px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .ext-card-header {
      background: var(--base2);
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      word-break: break-all;
      letter-spacing: .02em;
    }

    .ext-card-body { padding: 6px 10px; }

    /* Key-value rows */
    .kv-table { width: 100%; border-collapse: collapse; }
    .kv-table tr + tr td { border-top: 1px solid var(--base2); }
    .kv-table td {
      padding: 3px 4px;
      vertical-align: top;
      font-size: 12px;
    }
    .kv-table td.key {
      font-weight: 600;
      color: var(--base00);
      white-space: nowrap;
      padding-right: 10px;
      width: 1%;
    }
    .kv-table td.val { color: var(--base0); word-break: break-all; }

    /* Nested objects */
    .nested {
      border-left: 2px solid var(--base2);
      padding-left: 8px;
      margin-top: 2px;
    }

    /* Array items */
    .array-item + .array-item { margin-top: 4px; }
    .array-index {
      font-size: 10px;
      color: var(--base1);
      margin-bottom: 2px;
    }

    .empty { color: var(--base1); font-size: 12px; font-style: italic; }
  </style>
</head>
<body>

  <div class="brand-bar">Extension Inspector</div>

  <div class="pane">
    <div class="email-info" id="email-info">
      <div class="field"><label>From</label><span id="ei-from">—</span></div>
      <div class="field"><label>Subject</label><span id="ei-subject">—</span></div>
    </div>

    <div id="status">Loading…</div>
    <div id="extensions-container"></div>
  </div>

  <script src="../../shared/graph-utils.js?v=4"></script>
  <script src="taskpane.js?v=4"></script>
</body>
</html>
