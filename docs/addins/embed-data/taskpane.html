<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RPA Embed Data</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <style>
    /* Solarized Light */
    :root {
      --base3:  #fdf6e3; /* main background   */
      --base2:  #eee8d5; /* alt background    */
      --base1:  #93a1a1; /* muted / borders   */
      --base0:  #657b83; /* body text         */
      --base00: #586e75; /* emphasis / labels */
      --blue:   #268bd2;
      --orange: #cb4b16; /* brand accent      */
      --green:  #859900;
      --red:    #dc322f;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      color: var(--base0);
      background: var(--base3);
      padding: 0 0 12px;
    }

    .brand-bar {
      background: var(--orange);
      color: #fff;
      text-align: right;
      padding: 3px 10px;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: .04em;
      margin-bottom: 10px;
      opacity: .9;
    }

    .form-body { padding: 0 12px; }

    h2 {
      font-size: 13px;
      font-weight: 700;
      color: var(--blue);
      margin: 12px 0 6px;
      padding-bottom: 3px;
      border-bottom: 1px solid var(--base2);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    h2:first-of-type { margin-top: 0; }

    .field { margin-bottom: 8px; }
    label  { display: block; font-weight: 600; margin-bottom: 2px; color: var(--base00); font-size: 12px; }

    input[type="text"],
    select {
      width: 100%;
      padding: 5px 8px;
      border: 1px solid var(--base1);
      border-radius: 2px;
      font-size: 13px;
      font-family: inherit;
      background: var(--base3);
      color: var(--base00);
    }
    input[readonly] { background: var(--base2); color: var(--base1); }

    input:focus, select:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 1px var(--blue);
    }

    button {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 8px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 2px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: .03em;
    }
    button:hover  { background: #a93d10; }
    button:active { background: #8c300c; }

    .status       { min-height: 18px; margin-top: 6px; font-size: 12px; text-align: center; }
    .status.ok    { color: var(--green); }
    .status.error { color: var(--red); }
  </style>
</head>
<body>

  <div class="brand-bar" id="brand-bar">v0.2.0</div>
  <script>
    (function(){
      var t=["embed · enrich · automate","structured data, right on the message","tag it. route it. automate it.","from inbox to workflow","data in. noise out.","triage once. query forever.","attach meaning to your mail"];
      document.getElementById("brand-bar").textContent=t[new Date().getHours()%t.length];
    })();
  </script>

  <div class="form-body">

  <h2>Email</h2>

  <div class="field">
    <label for="from">From</label>
    <input type="text" id="from" readonly placeholder="loading…"/>
  </div>
  <div class="field">
    <label for="subject">Subject</label>
    <input type="text" id="subject" readonly placeholder="loading…"/>
  </div>
  <div class="field">
    <label for="message-id">Message ID</label>
    <input type="text" id="message-id" readonly placeholder="loading…" style="font-size:10px;font-family:monospace;"/>
  </div>

  <h2>Embed Data</h2>

  <div class="field">
    <label for="f-reference">Reference</label>
    <input type="text" id="f-reference" placeholder="e.g. ticket or case number"/>
  </div>
  <div class="field">
    <label for="f-category">Category</label>
    <input type="text" id="f-category" placeholder="e.g. Support / Sales / Finance"/>
  </div>
  <div class="field">
    <label for="f-priority">Priority</label>
    <input type="text" id="f-priority" placeholder="e.g. High / Medium / Low"/>
  </div>
  <div class="field">
    <label for="f-owner">Owner</label>
    <input type="text" id="f-owner" placeholder="assignee name or alias"/>
  </div>
  <div class="field">
    <label for="f-notes">Notes</label>
    <input type="text" id="f-notes" placeholder="free-form notes"/>
  </div>

  <div class="field">
    <label for="f-country">Country</label>
    <select id="f-country"></select>
  </div>
  <div class="field">
    <label for="f-year">Year</label>
    <select id="f-year"></select>
  </div>
  <div class="field">
    <label for="f-quarter">Quarter</label>
    <select id="f-quarter">
      <option>Q1</option>
      <option>Q2</option>
      <option>Q3</option>
      <option>Q4</option>
    </select>
  </div>

  <button id="save-btn">RPA Embed Data</button>
  <div id="status" class="status"></div>

  </div><!-- /.form-body -->

  <script src="../../shared/graph-utils.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
